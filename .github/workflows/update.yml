name: Měsíční aktualizace mapy výroben

on:
  schedule:
    # ERÚ zveřejňuje datové sady TEZ k 1. dni měsíce, obvykle během prvního týdne.
    # Běží denně 3.–12. v měsíci; když nic nového není, skript skončí bez commitu.
    - cron: '17 5 3-12 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Přepočítat i bez nových dat'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # plná historie, aby šel výsledek přenést na nejnovější main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Aktualizace dat
        run: python update.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit výsledků
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "Beze změn"; echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "Data ERÚ $(jq -r .tez docs/data/stav.json), licence $(jq -r .licence docs/data/stav.json)"
            # repozitář mezitím mohl dostat jiné commity (úpravy kódu, souběžný běh):
            # výsledky (docs/, state/) přeneseme na nejnovější main a teprve pak pushneme
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              echo "Push se nepovedl, zkouším znovu ($i/3)"; sleep 10
            done
            git log -1 --oneline origin/main | grep -q "Data ERÚ" || { echo "Push selhal"; exit 1; }
            echo "changed=true" >> "$GITHUB_ENV"
          fi
      - if: env.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: env.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deploy
        uses: actions/deploy-pages@v4
